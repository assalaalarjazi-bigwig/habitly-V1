<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#041E19"/>
    </linearGradient>
    <linearGradient id="ribbonLeft" x1="120" y1="100" x2="180" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ribbonRight" x1="330" y1="100" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="crossbar" x1="140" y1="256" x2="370" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(52, 211, 153, 0.2)" stroke-width="4"/>

  <!-- Glowing Ring Backdrop -->
  <circle cx="256" cy="256" r="165" stroke="rgba(16, 185, 129, 0.15)" stroke-width="12" stroke-dasharray="24 16"/>

  <!-- Stylized Modern H Emblem with Spark & Streak Loop -->
  <g filter="url(#glow)">
    <!-- Left Stem with rounded terminals -->
    <rect x="140" y="128" width="48" height="256" rx="24" fill="url(#ribbonLeft)"/>
    <!-- Right Stem -->
    <rect x="324" y="128" width="48" height="256" rx="24" fill="url(#ribbonRight)"/>
    <!-- Ascending Cross Ribbon -->
    <path d="M140 256C140 240 180 236 256 236C332 236 372 240 372 256C372 272 332 276 256 276C180 276 140 272 140 256Z" fill="url(#crossbar)"/>
    <!-- Golden Achievement Spark -->
    <circle cx="348" cy="148" r="16" fill="#FBBF24"/>
    <circle cx="348" cy="148" r="8" fill="#FFFBEB"/>
  </g>
</svg>
